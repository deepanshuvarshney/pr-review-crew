id: bare_except
description: A broad handler swallows every failure.
diff: |
  diff --git a/app/parse.py b/app/parse.py
  new file mode 100644
  index 0000000..1111111
  --- /dev/null
  +++ b/app/parse.py
  @@ -0,0 +1,5 @@
  +def parse(raw):
  +    try:
  +        return json.loads(raw)
  +    except Exception:
  +        pass
labels:
  - file: app/parse.py
    line: 4
    category: correctness
    contains: "except Exception"
  - file: app/parse.py
