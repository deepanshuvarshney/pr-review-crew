id: pickle_loads
description: Untrusted bytes are unpickled.
diff: |
  diff --git a/app/session.py b/app/session.py
  new file mode 100644
  index 0000000..1111111
  --- /dev/null
  +++ b/app/session.py
  @@ -0,0 +1,2 @@
  +def load_session(blob):
  +    return pickle.loads(blob)
labels:
  - file: app/session.py
    line: 2
    category: security
    contains: "pickle.loads"
  - file: app/session.py
    line: 1
    category: tests
    contains: "def load_session"
