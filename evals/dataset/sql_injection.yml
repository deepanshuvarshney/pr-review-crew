id: sql_injection
description: Interpolated SQL is sent to the driver.
diff: |
  diff --git a/app/db.py b/app/db.py
  new file mode 100644
  index 0000000..1111111
  --- /dev/null
  +++ b/app/db.py
  @@ -0,0 +1,3 @@
  +def get_user(name):
  +    cur.execute(f"SELECT * FROM users WHERE name = '{name}'")
  +    return cur.fetchone()
labels:
  - file: app/db.py
    line: 2
    category: security
    contains: "SELECT"
  - file: app/db.py
    line: 1
    category: tests
    contains: "def get_user"
