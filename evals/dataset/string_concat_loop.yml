id: string_concat_loop
description: A string is copied on every loop pass.
diff: |
  diff --git a/app/build.py b/app/build.py
  new file mode 100644
  index 0000000..1111111
  --- /dev/null
  +++ b/app/build.py
  @@ -0,0 +1,5 @@
  +def build(parts):
  +    out = ""
  +    for part in parts:
  +        out += part + ","
  +    return out
