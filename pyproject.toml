[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prcrew"
version = "0.1.0"
description = "Zero-cost multi-agent pull request reviewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PR Review Crew contributors" }]
keywords = ["code-review", "langgraph", "pull-request", "llm", "github-action"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "langgraph>=1.0,<2",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
prcrew = "prcrew.cli:main"

[project.urls]
Homepage = "https://github.com/deepanshuvarshney/pr-review-crew"
Repository = "https://github.com/deepanshuvarshney/pr-review-crew"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=prcrew --cov-report=term-missing --cov-fail-under=82"

[tool.coverage.run]
source = ["prcrew"]
branch = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["prcrew"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["prcrew"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
